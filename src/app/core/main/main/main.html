<main class="row planner-page">
  <header class="row planner-heading text-center">
    <h1>Planner - Squad Sustentação GEO</h1>
    <p class="planner-description">
      Organize e visualize o planejamento da sua squad
    </p>
  </header>

  <div class="planner-toolbar">
    <app-planner-display-options
      [selection]="displaySelection"
      [minDate]="days[0] || ''"
      [maxDate]="days[days.length - 1] || ''"
      (selectionApplied)="applyDisplaySelection($event)">
    </app-planner-display-options>

    <div class="planner-block-toolbar-container">
      <app-planner-block-toolbar
            [blocks]="blocks"
            [coatends]="coatends"
            (blockCreationRequested)="openBlockCreation()"
            (blockEditionRequested)="openBlockEditor($event)"
            class="planner-block-toolbar">
      </app-planner-block-toolbar>
    </div>
    
  </div>

  <nav class="planner-date-navigation" aria-label="Navegação do período">
    <button
      type="button"
      class="btn btn-outline-primary planner-navigation-button"
      (click)="previousDays()"
      [disabled]="dayWindowStart === 0"
      aria-label="Exibir período anterior">
      <span aria-hidden="true">←</span>
    </button>

    <span class="planner-date-range" aria-live="polite">
      <ng-container *ngIf="visibleDays.length > 0; else loadingRange">
        Exibindo
        <strong>{{ visibleDays[0] | date:'dd/MM/yyyy' }}</strong>
        até
        <strong>{{ visibleDays[visibleDays.length - 1] | date:'dd/MM/yyyy' }}</strong>
      </ng-container>
      <ng-template #loadingRange>Carregando período...</ng-template>
    </span>

    <button
      type="button"
      class="btn btn-outline-primary planner-navigation-button"
      (click)="nextDays()"
      [disabled]="dayWindowStart + dayWindowSize >= days.length"
      aria-label="Exibir próximo período">
      <span aria-hidden="true">→</span>
    </button>
  </nav>

  <app-planner
    #plannerComponent
    [hierarchy]="plannerHierarchy"
    [days]="visibleDays"
    [quarterHeaders]="quarterHeaders"
    [sprintHeaders]="sprintHeaders"
    [mode]="mode"
    [hasCompleteStructure]="hasCompleteStructure"
    [quarters]="quarters"
    [sprints]="sprints"
    [coatends]="coatends"
    [blocks]="blocks"
    [timeline]="timeline"
    (placeholderSubmitted)="createPlannerItem($event)"
    (blockCreationRequested)="openBlockCreation()"
    (blockEditionRequested)="openBlockEditor($any($event))">
  </app-planner>
</main>
