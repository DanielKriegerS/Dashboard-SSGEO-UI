<nav
  class="sidebar"
  [class.collapsed]="collapsed"
  aria-label="Navegação principal"
>
  <div class="sidebar-header">
    <span class="brand">Planner - SSGEO</span>

    <button
      type="button"
      class="toggle-btn"
      (click)="toggle()"
      [attr.aria-label]="collapsed ? 'Expandir menu' : 'Recolher menu'"
      [attr.title]="collapsed ? 'Expandir menu' : 'Recolher menu'"
    >
      <span
        class="toggle-icon"
        [class.expanded]="!collapsed"
        aria-hidden="true"
      ></span>
    </button>
  </div>

  <ul class="menu">
    <li>
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.title]="collapsed ? 'Home' : null"
      >
        <span class="menu-icon" aria-hidden="true">H</span>
        <span class="menu-label">Home</span>
      </a>
    </li>

    @for (group of menus; track group.id) {
      <li class="menu-group" routerLinkActive="group-active">
        <div class="menu-group-heading">
          <a [routerLink]="group.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            [attr.title]="collapsed ? group.label : null" [attr.aria-label]="group.label" (click)="openMenu(group.id)">
            <span class="menu-icon" aria-hidden="true">{{ group.id === 'planning' ? 'P' : 'A' }}</span>
            <span class="menu-label">{{ group.label }}</span>
          </a>
          <button type="button" class="submenu-toggle" [attr.aria-expanded]="!collapsed && expandedMenus().includes(group.id)"
            [attr.aria-controls]="'submenu-' + group.id" [attr.aria-label]="'Alternar submenus de ' + group.label"
            [attr.title]="'Alternar submenus de ' + group.label" (click)="toggleMenu(group.id)">
            <span class="submenu-chevron" [class.is-open]="!collapsed && expandedMenus().includes(group.id)" aria-hidden="true"></span>
          </button>
        </div>
        <ul class="submenu" [id]="'submenu-' + group.id" [hidden]="collapsed || !expandedMenus().includes(group.id)">
          @for (item of group.children; track item.path) {
            <li><a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ item.label }}</a></li>
          }
        </ul>
      </li>
    }
  </ul>

  <app-export-toolbar
    [fullWidth]="true"
    [collapsed]="collapsed">
  </app-export-toolbar>
</nav>
