<section class="planner-layout" aria-label="Quadro do planner">
  <app-planner-placeholder-actions
    #placeholderActions
    [mode]="mode"
    [hasCompleteStructure]="hasCompleteStructure"
    [quarters]="quarters"
    [sprints]="sprints"
    [coatends]="coatends"
    (submitted)="placeholderSubmitted.emit($event)">
  </app-planner-placeholder-actions>

  <div class="planner-table-container" role="region" aria-label="Tabela do planner" tabindex="0">
    <table class="table table-bordered text-center planner-table">
      <thead>
        <tr>
          <th rowspan="3" scope="col" class="align-middle planner-fixed-column">
            Planner
          </th>
          <th
            *ngFor="let q of quarterHeaders"
            [attr.colspan]="q.colspan"
            scope="colgroup"
            class="planner-quarter-header">
            <button
              *ngIf="isPlaceholderHeader(q, 'quarter'); else quarterLabel"
              type="button"
              class="planner-add-placeholder"
              aria-label="Adicionar Quarter"
              title="Adicionar Quarter"
              (click)="openPlaceholder({ type: 'quarter' })">
              +
            </button>
            <ng-template #quarterLabel>
              <button
                *ngIf="q.id !== '__empty__'; else emptyQuarter"
                type="button"
                class="planner-edit-label"
                title="Editar Quarter"
                (click)="openStructureEditor('quarter', q.id)">
                {{ q.description }}
              </button>
              <ng-template #emptyQuarter>-</ng-template>
            </ng-template>
          </th>
        </tr>
        <tr>
          <th
            *ngFor="let s of sprintHeaders"
            [attr.colspan]="s.colspan"
            scope="colgroup"
            class="planner-sprint-header">
            <button
              *ngIf="isPlaceholderHeader(s, 'sprint'); else sprintLabel"
              type="button"
              class="planner-add-placeholder"
              aria-label="Adicionar Sprint"
              title="Adicionar Sprint"
              (click)="openPlaceholder({ type: 'sprint' })">
              +
            </button>
            <ng-template #sprintLabel>
              <button
                *ngIf="s.id !== '__empty__'; else emptySprint"
                type="button"
                class="planner-edit-label"
                title="Editar Sprint"
                (click)="openStructureEditor('sprint', s.id)">
                {{ s.description }}
              </button>
              <ng-template #emptySprint>-</ng-template>
            </ng-template>
          </th>
        </tr>
        <tr>
          <th *ngFor="let day of days" scope="col" class="planner-day-header">
            {{ day | date:'dd/MM' }}
          </th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let q of hierarchy">
          <ng-container *ngFor="let s of q.sprints">
            <tr
              *ngFor="let row of s.coatends"
              [class.planner-placeholder-row]="row.isPlaceholder">
              <td class="text-start planner-fixed-column planner-coatend-cell">
                <button
                  *ngIf="row.isPlaceholder; else coatendLabel"
                  type="button"
                  class="planner-add-placeholder"
                  aria-label="Adicionar Coatend"
                  title="Adicionar Coatend"
                  (click)="openPlaceholder({ type: 'coatend' })">
                  +
                </button>
                <ng-template #coatendLabel>
                  <button
                    type="button"
                    class="planner-edit-label"
                    title="Editar Coatend"
                    (click)="openStructureEditor('coatend', row.coatendId!)">
                    {{ row.coatendDescription }}
                  </button>
                </ng-template>
              </td>
              <td
                *ngFor="let cell of row.cells"
                class="planner-day-cell planner-add-activity-cell"
                tabindex="0"
                [attr.aria-label]="'Adicionar atividade em ' + (cell.date | date:'dd/MM/yyyy')"
                title="Clique no espaço da célula para adicionar uma atividade"
                (click)="openActivityCreation(cell.date, row.coatendId)"
                (keydown)="onActivityCellKeydown($event, cell.date, row.coatendId)">
                <div class="planner-cell-content">
                  <button
                    *ngFor="let entry of cell.entries"
                    type="button"
                    class="px-1 rounded planner-entry"
                    [style.background-color]="safeColor(entry.performerColor)"
                    [style.color]="getTextColor(entry.performerColor)"
                    [title]="'Editar atividade: ' + entry.activity"
                    [attr.aria-label]="'Editar atividade: ' + entry.activity"
                    (click)="$event.stopPropagation(); openActivityEditor(entry, row.coatendId)">
                    {{ getShortActivity(entry.activity) }}
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="mode === 'structured'" class="planner-placeholder-row">
              <td class="text-start planner-fixed-column planner-coatend-cell">
                <button
                  type="button"
                  class="planner-add-placeholder"
                  aria-label="Adicionar Coatend nesta Sprint"
                  title="Adicionar Coatend"
                  (click)="openPlaceholder({ type: 'coatend', sprintId: s.sprintId })">
                  +
                </button>
              </td>
              <td
                *ngFor="let day of days"
                class="planner-day-cell planner-add-activity-cell"
                tabindex="0"
                [attr.aria-label]="'Adicionar atividade em ' + (day | date:'dd/MM/yyyy')"
                title="Adicionar atividade"
                (click)="openActivityCreation(day, null)"
                (keydown)="onActivityCellKeydown($event, day, null)">
              </td>
            </tr>
          </ng-container>
        </ng-container>
      </tbody>
    </table>
  </div>
</section>
