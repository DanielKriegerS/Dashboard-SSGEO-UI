<div *ngIf="sprint"> 
  <div class="row align-items-center justify-content-center">
    <h1 class="text-center">{{description}}</h1>
  </div>
  

  <div class="d-flex align-items-center">
    <div class="flex-grow-1">
      <app-carousel-navigator
        (prev)="prev()"
        (next)="next()"
        [disablePrev]="startIndex === 0"
        [disableNext]="startIndex + 3 >= (coatends.length || 0)"
      >
        <ng-container *ngIf="coatends.length > 0; else emptyState">
          <div class="row">
            <div class="col-md-4" *ngFor="let c of visibleCoatends">
              <a [routerLink]="['/coatends', c.id]" class="text-decoration-none">
                <app-card
                  [title]="c.description"
                  [subtitle]="'#' + c.coatendNumber">
                </app-card>
              </a>
            </div>
          </div>
        </ng-container>
      </app-carousel-navigator>
      
      <ng-template #emptyState>
        <app-notfoundfallback 
          *ngIf="visibleCoatends.length === 0"
          [title]="'Coatend '">
        </app-notfoundfallback>
      </ng-template>

      <app-datecomponent
        [startDate]="sprint.startDate | date:'shortDate'",
        [endDate]="sprint.endDate | date:'shortDate'"
      ></app-datecomponent>
    </div>
  </div>
</div>

<app-dynamic-edit-component
  title="Editar Sprint"
  [fields]="editFields"
  [data]="sprintToUpdate"
  [updateFn]="updateSprint">
</app-dynamic-edit-component>

<app-delete-button
  label="Excluir Sprint"
  [deleteFn]="deleteSprint"
  class="col-2 mr-0">
</app-delete-button>

<app-move-to
  title="Mover Sprint para outro Quarter"
  [hierarchyLevel]="quarterDescription"
  [options]="quartersOptions"
  [moveFn]="moveSprint">
</app-move-to>
