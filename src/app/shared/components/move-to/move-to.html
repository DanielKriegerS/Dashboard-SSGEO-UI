<details class="move-section">
  <summary>
    <span>{{ title }}</span>
    @if (hierarchyLevel) {
      <span class="move-current">{{ hierarchyLevel }}</span>
    }
  </summary>
  <div class="move-controls">
    <select class="form-select" [attr.aria-label]="title" [(ngModel)]="selectedId">
      <option value="" disabled>Selecione</option>
      @for (opt of options; track opt.id) {
        <option [value]="opt.id">{{ opt.label }}</option>
      }
    </select>
    <button type="button" class="btn btn-success" [disabled]="!selectedId" (click)="submit()">Mover</button>
  </div>
</details>
